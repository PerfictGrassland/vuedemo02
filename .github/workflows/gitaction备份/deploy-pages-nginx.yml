name: Vue CI Build & Deploy - Local Ubuntu
on:
  push:
    branches: [main]

jobs:
  build-job:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: 'npm'
      - name: 安装依赖
        run: npm ci
      - name: Vue打包
        run: npm run build
      - name: 保存dist产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/

  deploy-ubuntu:
    needs: build-job
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 下载打包产物dist
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist/

      # 👇 核心：通过 SSH 上传到 Ubuntu
      - name: 通过 SSH 上传 dist 到 Ubuntu
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # 重点：这里要写你 Ubuntu 里 Nginx 配置的静态目录
          target: '/home/schen88/static-html/vuedemo03'
          # 把 dist 里的内容直接传上去（如果传 dist 文件夹，会变成 dist/dist/）
          source: 'dist/*'
          # 这个参数很关键：去掉原文件路径中的 dist/ 这一级目录，直接把里面的文件平铺到 target 里
          strip_components: 1

      # （可选）如果你想自动刷新 Nginx，可以加这一步
      - name: 重启 Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Nginx 配置已重新加载"
            # sudo nginx -s reload （如果需要 sudo，记得解决 sudo 权限问题）
